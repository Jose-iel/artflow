name: CI - Tests

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install backend dependencies
        run: cd backend && pnpm install --no-frozen-lockfile
      
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      
      - name: Run backend linter
        run: cd backend && pnpm lint
        continue-on-error: true
      
      - name: Run backend tests
        run: cd backend && pnpm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: artflow_test
          JWT_SECRET: test-secret-key-for-ci
      
      - name: Build backend
        run: cd backend && pnpm build
      
      - name: Run frontend linter
        run: cd frontend && pnpm lint
        continue-on-error: true
      
      - name: Run frontend tests
        run: cd frontend && pnpm test
        continue-on-error: true
      
      - name: Build frontend
        run: cd frontend && pnpm build
      
      - name: Comment PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **CI Tests ${status}**\n\nBackend tests, frontend tests, and builds completed.`
            })
