name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install backend dependencies
        run: cd backend && pnpm install --no-frozen-lockfile
      
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      
      - name: Run backend tests
        run: cd backend && pnpm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: artflow_test
          JWT_SECRET: test-secret-key-for-ci
      
      - name: Run frontend tests
        run: cd frontend && pnpm test:ci
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/artflow
            
            echo "📥 Pulling latest code..."
            git pull origin main
            
            echo "🛑 Stopping containers..."
            docker compose -f docker/docker-compose.prod.yaml down
            
            echo "🏗️  Building images..."
            docker compose -f docker/docker-compose.prod.yaml build --no-cache
            
            echo "🚀 Starting containers..."
            docker compose -f docker/docker-compose.prod.yaml up -d
            
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            echo "🏥 Health check..."
            if curl -f http://localhost:3333/api/health; then
              echo "✅ Backend is healthy!"
            else
              echo "❌ Backend health check failed!"
              echo "🔄 Rolling back..."
              docker compose -f docker/docker-compose.prod.yaml down
              git reset --hard HEAD~1
              docker compose -f docker/docker-compose.prod.yaml up -d
              exit 1
            fi
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deploy successful!"
      
      - name: Notify success
        if: success()
        run: |
          echo "✅ Deploy to production completed successfully!"
          echo "🌐 Frontend: https://artflow.iel-company.com.br"
          echo "🔌 Backend: https://backend-artflow.iel-company.com.br"
      
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy failed! Check logs above."
          exit 1
