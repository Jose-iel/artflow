global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'artflow-monitor'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'artflow-vps'

  # Backend API (if you add metrics endpoint)
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3333']
        labels:
          service: 'artflow-backend'
    metrics_path: '/metrics'
    # Uncomment when you add metrics endpoint to backend
    # scrape_interval: 30s

  # PostgreSQL Exporter (optional - add later if needed)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
