name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: cd backend && pnpm install --no-frozen-lockfile
      
      - name: Run tests
        run: cd backend && pnpm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: artflow_test
          JWT_SECRET: test-secret-key-for-ci
  
  test-frontend:
    name: 🎨 Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      
      - name: Run tests
        run: cd frontend && pnpm test:ci
  
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true
          envs: GITHUB_TOKEN,POSTGRES_PASSWORD,JWT_SECRET,GRAFANA_PASSWORD
          script: |
            # 🔐 Configurar autenticação Git com GITHUB_TOKEN
            git config --global credential.helper store
            echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
            
            cd /opt/artflow
            
            echo "📥 Pulling latest code..."
            # Descartar mudanças locais e garantir sincronia com GitHub
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            echo "📝 Creating environment files..."
            # Criar arquivo .env.production
            cat > .env.production << EOF
            NODE_ENV=production
            PORT=3333
            
            # Database
            DB_HOST=artflow_postgres_prod
            DB_PORT=5432
            DB_USERNAME=postgres
            DB_PASSWORD=${POSTGRES_PASSWORD}
            DB_DATABASE=artflow_prod
            
            # JWT
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRATION=7d
            EOF
            
            # Criar arquivo docker/.env
            cat > docker/.env << EOF
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
            EOF
            
            echo "🛑 Stopping containers..."
            docker compose -f docker/docker-compose.prod.yaml down
            
            echo "🏗️  Building images..."
            docker compose -f docker/docker-compose.prod.yaml build --no-cache
            
            echo "🚀 Starting containers..."
            docker compose -f docker/docker-compose.prod.yaml up -d
            
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            echo "🗄️  Applying database migrations..."
            COMPOSE_FILE=docker/docker-compose.prod.yaml \
            DB_SERVICE=db \
            DB_NAME=artflow_prod \
              bash scripts/run-migrations.sh
            
            echo "🏥 Health check..."
            if curl -f http://localhost:3333/api/health; then
              echo "✅ Backend is healthy!"
            else
              echo "❌ Backend health check failed!"
              echo "🔄 Rolling back..."
              docker compose -f docker/docker-compose.prod.yaml down
              git reset --hard HEAD~1
              docker compose -f docker/docker-compose.prod.yaml up -d
              rm -f ~/.git-credentials
              exit 1
            fi
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # 🔒 Remover credenciais após deploy (segurança)
            rm -f ~/.git-credentials
            
            echo "✅ Deploy successful!"
      
      - name: Notify success
        if: success()
        run: |
          echo "✅ Deploy to production completed successfully!"
          echo "🌐 Frontend: https://artflow.iel-company.com.br"
          echo "🔌 Backend: https://backend-artflow.iel-company.com.br"
      
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy failed! Check logs above."
          exit 1
